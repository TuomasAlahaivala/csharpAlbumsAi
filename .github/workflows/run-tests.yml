name: Run tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  test:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore AlbumsWebApp.Tests/AlbumsWebApp.Tests.csproj

      - name: Run tests
        run: dotnet test AlbumsWebApp.Tests/AlbumsWebApp.Tests.csproj --no-restore --configuration Release
