name: Run tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AlbumsWebApp.Tests/AlbumsWebApp.Tests.csproj

      - name: Run tests
        run: dotnet test AlbumsWebApp.Tests/AlbumsWebApp.Tests.csproj --no-restore --configuration Release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json

      - name: Install frontend dependencies
        working-directory: ClientApp
        run: npm ci

      - name: Lint frontend
        working-directory: ClientApp
        run: npm run lint

      - name: Test frontend
        working-directory: ClientApp
        run: npm test

      - name: Build production container
        run: docker build --tag albums-webapp:ci .
