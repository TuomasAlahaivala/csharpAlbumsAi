services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: albums
      POSTGRES_USER: albums
      POSTGRES_PASSWORD: albums_dev
    ports:
      - "5433:5432"
    volumes:
      - albums-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albums -d albums"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  albums-postgres-data:
